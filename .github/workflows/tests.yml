name: tests

# 第1段階（unit）: GDAL / PDAL / QGIS なしで実行できるテストだけを回す。
# 第2段階（gdal）: Ubuntu 24.04 のパッケージの GDAL（3.8系）と NumPy・SciPy で、
# GDAL を使うテスト（結合テスト・XYZ・入力変換）も回す。
# どちらでも、QGIS・PDAL を必要とするテストは自動的にスキップされる
# （スキップ分は未実行であり、合格を意味しない）。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inspection tools
        run: python -m pip install flake8==7.4.1 bandit==1.9.4 detect-secrets==1.5.0
      - name: Code quality
        run: flake8 csmap_sheets tools
      - name: Security
        run: bandit -r csmap_sheets -x csmap_sheets/tests
      - name: Secrets
        run: |
          detect-secrets scan csmap_sheets tools > /tmp/secrets.json
          python -c "import json; d=json.load(open('/tmp/secrets.json')); assert not d['results'], 'Potential secrets detected'"
      - name: Validate submission package
        run: python tools/check_plugin_package.py /tmp/csmap_sheets.zip
      - name: Upload validated submission ZIP
        uses: actions/upload-artifact@v4
        with:
          name: csmap-sheets-submission
          path: /tmp/csmap_sheets.zip
          if-no-files-found: error

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy
      - name: Compile
        run: python -m compileall -q csmap_sheets
      - name: Unit tests
        run: python -m unittest discover -s csmap_sheets/tests -t . -v

  gdal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL, NumPy and SciPy (Ubuntu packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gdal python3-numpy python3-scipy
      - name: Show versions
        run: /usr/bin/python3 -c "from osgeo import gdal; import numpy, scipy; print('GDAL', gdal.VersionInfo('RELEASE_NAME'), 'numpy', numpy.__version__, 'scipy', scipy.__version__, 'WEBP', gdal.GetDriverByName('WEBP') is not None)"
      - name: Unit and GDAL integration tests
        run: /usr/bin/python3 -m unittest discover -s csmap_sheets/tests -t . -v
